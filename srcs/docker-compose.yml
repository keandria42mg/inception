services:
  mariadb:
    build: ./requirements/mariadb/
    container_name: mariadb
    env_file: .env
    expose:
      - "3306"
    volumes:
      - mariadb:/var/lib/mysql
    networks:
      - inception
    restart: on-failure

  wordpress:
    build: ./requirements/wordpress/
    container_name: wordpress
    depends_on:
      - mariadb
    env_file: .env
    expose:
      - "9000"
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    restart: on-failure

  nginx:
    build: ./requirements/nginx/
    container_name: nginx
    ports:
      - "443:443"
    env_file: .env
    volumes:
      - wordpress:/var/www/html
    networks:
      - inception
    restart: on-failure

networks:
  inception:
    driver: bridge

volumes:
  mariadb:
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/data/mariadb/
      o: bind

  wordpress:
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/data/wordpress/
      o: bind
